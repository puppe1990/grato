<div class="space-y-1.5">
  {{ if .Label }}<label class="block text-[13px] font-semibold text-espresso" for="{{ .Name }}">{{ .Label }}</label>{{ end }}
  <div class="cais-password-wrap">
    <input
      class="hearth-input pr-12"
      id="{{ .Name }}"
      name="{{ .Name }}"
      type="password"
      {{- if .Value }} value="{{ .Value }}"{{ end }}
      {{- if .Placeholder }} placeholder="{{ .Placeholder }}"{{ end }}
      {{- if .Autocomplete }} autocomplete="{{ .Autocomplete }}"{{ end }}
      {{- if .Required }} required{{ end }}
      {{- if .Error }} aria-invalid="true"{{ end }}
    >
    <button type="button"
            class="cais-password-toggle"
            amarra-hook="password"
            data-amarra-password-for="#{{ .Name }}"
            data-amarra-label-show="Mostrar senha"
            data-amarra-label-hide="Ocultar senha"
            aria-pressed="false"
            aria-label="Mostrar senha">
      <span data-amarra-password-icon="show"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg></span>
      <span data-amarra-password-icon="hide" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg></span>
    </button>
  </div>
  {{ if .Hint }}<p class="text-[12px] text-clay">{{ .Hint }}</p>{{ end }}
  {{ if .Error }}<p class="text-[13px] font-medium text-[#93000A]">{{ .Error }}</p>{{ end }}
</div>
