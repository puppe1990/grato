<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph card (1200x630) for Grato.

  The phone mockup shows a real screenshot of the Hoje screen, so the app's own
  typography (Literata + Plus Jakarta Sans) is carried by the image itself.
  The surrounding brand text uses Georgia, an editorial serif that stands in
  for Literata and is available everywhere this gets re-rendered.

  Rebuild:
    rsvg-convert -w 1200 -h 630 design/og.svg -o web/static/og.png
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 630" width="1200" height="630" fill="none"
     role="img" aria-label="Grato — Diário da Gratidão">

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF9F4"/>
      <stop offset="52%" stop-color="#F6F0E7"/>
      <stop offset="100%" stop-color="#E9DFD3"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D97746" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D97746" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sageGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5A7865" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5A7865" stop-opacity="0"/>
    </radialGradient>

    <filter id="phoneShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#2B2623" flood-opacity="0.16"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="846" y="116" width="244" height="528" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <circle cx="1010" cy="120" r="360" fill="url(#ember)"/>
  <circle cx="120" cy="600" r="300" fill="url(#sageGlow)"/>

  <!-- Brand lockup -->
  <g transform="translate(96 104) scale(0.6)">
    <circle cx="50" cy="50" r="46" fill="#F4ECE1"/>
    <path d="M50 22C43 32 30 42 30 54C30 65.0457 38.9543 74 50 74C61.0457 74 70 65.0457 70 54C70 42 57 32 50 22Z" fill="#D97746" fill-opacity="0.85"/>
    <path d="M50 36C45 44 38 50 38 58C38 64.6274 43.3726 70 50 70C56.6274 70 62 64.6274 62 58C62 50 55 44 50 36Z" fill="#FAF7F2"/>
    <circle cx="50" cy="58" r="5" fill="#5A7865"/>
    <path d="M50 14V18M50 82V86M14 50H18M82 50H86" stroke="#D97746" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="176" y="133" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2623">Grato</text>
  <text x="178" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="3.4" fill="#6E655F">DIÁRIO DA GRATIDÃO</text>

  <!-- Promise -->
  <text x="96" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#2B2623">Um diário de gratidão</text>
  <text x="96" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#2B2623">calmo e privado.</text>

  <rect x="96" y="446" width="132" height="3" rx="1.5" fill="#D97746" fill-opacity="0.65"/>

  <text x="96" y="504" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6E655F">Três momentos por dia · memórias · ecos</text>
  <text x="96" y="548" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#A39990">grato.apps.gestaobem.com</text>

  <!-- Phone mockup: a real capture of the Hoje screen -->
  <g filter="url(#phoneShadow)">
    <rect x="836" y="106" width="264" height="548" rx="40" fill="#FFFDFA" stroke="#2B2623" stroke-opacity="0.10" stroke-width="2"/>
  </g>
  <rect x="846" y="116" width="244" height="528" rx="30" fill="#FAF7F2"/>
  <image x="846" y="116" width="244" height="528" clip-path="url(#screenClip)"
         xlink:href="./og-phone.png" preserveAspectRatio="xMidYMin slice"/>
  <rect x="846" y="116" width="244" height="528" rx="30" fill="none" stroke="#2B2623" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
